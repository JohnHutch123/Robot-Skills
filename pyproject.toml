[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-skills-validator"
version = "0.1.0"
description = "Authoring validation for the Robot Skills YAML/JSON draft"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0.2,<7",
]

[project.scripts]
rs-validate = "robot_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robot_skills = ["*.json"]
